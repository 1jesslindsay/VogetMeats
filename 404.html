<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — Voget Meats, Hubbard, Oregon.">
    <title>Page Not Found | Voget Meats</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Google Fonts - Bebas Neue for nav links (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"></noscript>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/Favicon.png">

    <!-- Prevent dark mode flash -->
    <script>if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}</script>

    <style>
        .not-found-section {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1rem;
        }
        .not-found-section h1 {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: var(--accent, #8b1a1a);
        }
        .not-found-section h2 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        .not-found-section p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: var(--text-muted, #666);
        }
        .not-found-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <header></header>

    <main>
        <section class="not-found-section">
            <div class="container">
                <h1>404</h1>
                <h2>Page Not Found</h2>
                <p>Sorry, we couldn't find the page you were looking for.</p>
                <div class="not-found-links">
                    <a href="index.html" class="btn">Go Home</a>
                    <a href="products.html" class="btn">View Products</a>
                    <a href="contact.html" class="btn">Contact Us</a>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="components.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
